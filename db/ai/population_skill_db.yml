###########################################################################
# Population Engine Skill Database
###########################################################################
#
# Per-job skill overrides for population shells.
# Loaded at map-server startup and with @reloadpopengine.
# Priority: this file > population_engine.yml Skills: > compiled job defaults > skill tree scan.
#
###########################################################################
# - JobId:           Job class numeric ID (required).
#   Skills:          Sequence of skill entries (required).
#     SkillId:       Skill name (e.g. SM_BASH) or numeric ID (required).
#     Level:         Skill level to cast. (Default: 1)
#     Rate:          1â€“10000 per-10000 chance; 0 disables entry. (Default: 10000)
#     State:         0=any, 1=has_target (combat), 2=no_target (roam). (Default: 0)
#     Target:        0=current target, 1=self, 2=ally (nearest BL_PC in skill range). (Default: 0)
#     Condition:     Gate condition name. (Default: always)
#       always           â€” no gate; always eligible.
#       hp_below         â€” self HP% < CondValue.
#       sp_below         â€” self SP% < CondValue.
#       hp_above         â€” self HP% > CondValue.
#       enemy_hp_below   â€” target HP% < CondValue.
#       enemy_hp_above   â€” target HP% > CondValue.
#       enemy_status     â€” target has SC named in CondValue (e.g. SC_FREEZE).
#       not_enemy_status â€” target does NOT have SC named in CondValue.
#       self_status      â€” self has SC named in CondValue.
#       not_self_status  â€” self does NOT have SC named in CondValue.
#       distance_below   â€” distance to target <= CondValue cells.
#       distance_above   â€” distance to target >  CondValue cells.
#       enemy_count_nearby â€” >= CondValue enemies within detection range.
#       map_zone         â€” spawned in zone: 1=town, 2=field, 3=dungeon.
#       melee_attacked   â€” a melee-range enemy is targeting this shell.
#       range_attacked   â€” a ranged enemy is targeting this shell.
#       ally_hp_below    â€” any ally in skill range has HP% < CondValue.
#       ally_status      â€” any ally in skill range has SC named in CondValue.
#       not_ally_status  â€” no ally in skill range has SC named in CondValue.
#       has_sphere       â€” shell has >= CondValue spirit spheres.
#       enemy_hidden     â€” any enemy in detection range is hidden/cloaked.
#       enemy_casting    â€” target is currently casting a skill.
#       enemy_casting_ground â€” target is casting a ground-targeted skill.
#       cell_has_skill_unit â€” self cell has an active skill unit on it.
#       self_targeted    â€” an enemy is targeting this shell specifically.
#       enemy_element    â€” target's element == CondValue (0=Neutral..9=Undead).
#       enemy_race       â€” target's race == CondValue (0=Formless..9=Dragon).
#       ally_count_nearby â€” >= CondValue allies within detection range.
#       enemy_is_boss    â€” target is an MVP/boss monster.
#       sp_above         â€” self SP% > CondValue.
#     CondValue:     Numeric threshold (0â€“100 for %/cells) or SC name string
#                    for *_status conditions. (Default: 0)
#
# Note: Sphere-chain jobs (Monk=15, Champion=4016) run the sphere-chain state
#       machine first; CALLSPIRITS/FURY/ASURA entries here serve as seed fallbacks only.
###########################################################################

Header:
  Type: POPULATION_SKILL_DB
  Version: 1

Body:
  # ---------------------------------------------------------------------------
  # 1st jobs
  # ---------------------------------------------------------------------------

  # JOB_SWORDMAN = 1
  - JobId: 1
    Skills:
      # -- passive --
      - { SkillId: SM_SWORD,       Level: 10, Rate: 10000 }
      - { SkillId: SM_TWOHAND,     Level: 10, Rate: 10000 }
      - { SkillId: SM_RECOVERY,    Level: 10, Rate: 10000 }
      - { SkillId: SM_FATALBLOW,   Level: 1,  Rate: 10000 }
      - { SkillId: SM_MOVINGRECOVERY, Level: 1, Rate: 10000 }
      # -- offense --
      - { SkillId: SM_BASH,       Level: 10, Rate: 10000 }
      - { SkillId: SM_MAGNUM,     Level: 10, Rate: 7000,  Condition: enemy_count_nearby, CondValue: 2 }
      - { SkillId: SM_PROVOKE,    Level: 10, Rate: 5000,  Condition: not_enemy_status, CondValue: SC_PROVOKE }
      # -- self-buffs --
      - { SkillId: SM_ENDURE,     Level: 10, Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_ENDURE }
      - { SkillId: SM_AUTOBERSERK, Level: 1, Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_AUTOBERSERK }

  # JOB_MAGE = 2
  - JobId: 2
    Skills:
      # -- passive --
      - { SkillId: MG_SRECOVERY,     Level: 10, Rate: 10000 }
      # -- offense (elemental combo: freeze â†’ lightning) --
      - { SkillId: MG_LIGHTNINGBOLT, Level: 10, Rate: 10000, Condition: enemy_status, CondValue: SC_FREEZE }
      - { SkillId: MG_FIREBOLT,      Level: 10, Rate: 10000 }
      - { SkillId: MG_COLDBOLT,      Level: 10, Rate: 8000  }
      - { SkillId: MG_FROSTDIVER,    Level: 10, Rate: 8000  }
      - { SkillId: MG_SOULSTRIKE,    Level: 10, Rate: 7000  }
      - { SkillId: MG_FIREBALL,      Level: 10, Rate: 7000  }
      - { SkillId: MG_NAPALMBEAT,    Level: 10, Rate: 6000  }
      - { SkillId: MG_THUNDERSTORM,  Level: 10, Rate: 6000, Condition: enemy_count_nearby, CondValue: 3 }
      # -- defense --
      - { SkillId: MG_SAFETYWALL,    Level: 10, Target: 1,  Condition: melee_attacked }
      # -- self-buffs --
      - { SkillId: MG_ENERGYCOAT,    Level: 1,  Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_ENERGYCOAT }
      - { SkillId: MG_SIGHT,         Level: 1,  Rate: 10000, Target: 1, Condition: enemy_hidden }

  # JOB_ARCHER = 3
  - JobId: 3
    Skills:
      # -- passive --
      - { SkillId: AC_OWL,          Level: 10, Rate: 10000 }
      - { SkillId: AC_VULTURE,      Level: 10, Rate: 10000 }
      # -- offense --
      - { SkillId: AC_DOUBLE,       Level: 10, Rate: 10000 }
      - { SkillId: AC_SHOWER,       Level: 10, Rate: 8000, Condition: enemy_count_nearby, CondValue: 3 }
      - { SkillId: AC_CHARGEARROW,  Level: 1,  Rate: 6000, Condition: distance_below, CondValue: 3 }
      # -- self-buff --
      - { SkillId: AC_CONCENTRATION, Level: 10, Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_CONCENTRATE }

  # JOB_ACOLYTE = 4
  # Acolyte mercenary support kit (Phase 6).
  # Order is priority â€” the support tick uses cursor=null and returns the
  # first skill whose condition matches. Heal first, then status cleanse,
  # then buff refresh.
  # Target: 4 = PARTY â€” iterates owner+party, casts on first member matching
  # the condition. Heals find lowest-HP, buffs find first member missing.
  - JobId: 4
    Skills:
      - { SkillId: AL_HEAL,       Level: 5,  Rate: 10000, Target: 4, Condition: owner_hp_below,    CondValue: 70 }
      - { SkillId: AL_CURE,       Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,      CondValue: silence }
      - { SkillId: AL_CURE,       Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,      CondValue: blind }
      - { SkillId: AL_BLESSING,   Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status,  CondValue: blessing }
      - { SkillId: AL_INCAGI,     Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status,  CondValue: increase_agi }
      - { SkillId: AL_ANGELUS,    Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,   CondValue: angelus }

  # JOB_MERCHANT = 5
  - JobId: 5
    Skills:
      # -- passive --
      - { SkillId: MC_INCCARRY,       Level: 10, Rate: 10000 }
      - { SkillId: MC_DISCOUNT,       Level: 10, Rate: 10000 }
      - { SkillId: MC_OVERCHARGE,     Level: 10, Rate: 10000 }
      - { SkillId: MC_PUSHCART,       Level: 10, Rate: 10000 }
      # -- offense --
      - { SkillId: MC_MAMMONITE,      Level: 10, Rate: 10000 }
      - { SkillId: MC_CARTREVOLUTION, Level: 1,  Rate: 8000, Condition: enemy_count_nearby, CondValue: 2 }
      # -- self-buff --
      - { SkillId: MC_LOUD,           Level: 1,  Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_LOUD }

  # JOB_THIEF = 6
  - JobId: 6
    Skills:
      # -- passive --
      - { SkillId: TF_DOUBLE,        Level: 10, Rate: 10000 }
      - { SkillId: TF_MISS,          Level: 10, Rate: 10000 }
      # -- offense --
      - { SkillId: TF_POISON,        Level: 10, Rate: 10000 }
      - { SkillId: TF_SPRINKLESAND,  Level: 1,  Rate: 6000  }
      - { SkillId: TF_THROWSTONE,    Level: 1,  Rate: 5000  }
      # -- escape --
      - { SkillId: TF_BACKSLIDING,   Level: 1,  Rate: 6000, Target: 1, Condition: hp_below, CondValue: 25 }
      # -- support --
      - { SkillId: TF_DETOXIFY,      Level: 1,  Rate: 8000, Target: 1, Condition: self_status, CondValue: SC_POISON }
      # -- reactive hide --
      - { SkillId: TF_HIDING,        Level: 10, Rate: 6000, Target: 1, Condition: self_targeted }

  # ---------------------------------------------------------------------------
  # 2nd jobs
  # ---------------------------------------------------------------------------

  # JOB_KNIGHT = 7
  - JobId: 7
    Skills:
      # -- passive --
      - { SkillId: KN_SPEARMASTERY,   Level: 10, Rate: 10000 }
      - { SkillId: KN_CAVALIERMASTERY, Level: 5, Rate: 10000 }
      - { SkillId: KN_RIDING,         Level: 1,  Rate: 10000 }
      # -- offense --
      - { SkillId: KN_BOWLINGBASH,    Level: 10, Rate: 10000, Condition: distance_below, CondValue: 4 }
      - { SkillId: KN_BOWLINGBASH,    Level: 10, Rate: 7000  }
      - { SkillId: KN_BRANDISHSPEAR,  Level: 10, Rate: 8000  }
      - { SkillId: KN_PIERCE,         Level: 10, Rate: 6000  }
      - { SkillId: KN_SPEARSTAB,      Level: 10, Rate: 5000  }
      - { SkillId: KN_SPEARBOOMERANG, Level: 5,  Rate: 6000, Condition: distance_above, CondValue: 3 }
      # -- self-buffs --
      - { SkillId: KN_TWOHANDQUICKEN, Level: 10, Target: 1, Condition: not_self_status, CondValue: SC_TWOHANDQUICKEN }
      - { SkillId: KN_AUTOCOUNTER,    Level: 5,  Rate: 5000, Target: 1, Condition: melee_attacked }

  # JOB_PRIEST = 8 â€” mercenary support kit (Phase 6).
  # Order = priority. Self-survival first, then owner emergencies, then
  # status cleansing, then offensive support, then buffs.
  - JobId: 8
    Skills:
      # Resurrect first if owner is dead — Heal on a corpse does nothing.
      - { SkillId: ALL_RESURRECTION, Level: 4, Rate: 10000, Target: 4, Condition: owner_hp_below, CondValue: 1 }
      # Self-heal so the merc survives stray AoE.
      - { SkillId: AL_HEAL,         Level: 10, Rate: 10000, Target: 1, Condition: hp_below,        CondValue: 50 }
      # Owner emergency heal (high threshold so support feels responsive).
      - { SkillId: AL_HEAL,         Level: 10, Rate: 10000, Target: 4, Condition: owner_hp_below,  CondValue: 75 }
      # Status cleanse on owner.
      - { SkillId: AL_CURE,         Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: silence }
      - { SkillId: AL_CURE,         Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: blind }
      # Kyrie shield (PR_KYRIE has its own duration; refresh when missing).
      - { SkillId: PR_KYRIE,        Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: kyrie }
      - { SkillId: PR_KYRIE,        Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: kyrie }
      # Self buffs first â€” the merc must keep itself buffed too.
      - { SkillId: PR_MAGNIFICAT,   Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: magnificat }
      - { SkillId: AL_ANGELUS,      Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: angelus }
      - { SkillId: PR_GLORIA,       Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: gloria }
      - { SkillId: AL_BLESSING,     Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: blessing }
      - { SkillId: AL_INCAGI,       Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: increase_agi }
      # Owner buffs (single-target Priest versions).
      - { SkillId: AL_BLESSING,     Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: blessing }
      - { SkillId: AL_INCAGI,       Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: increase_agi }
      - { SkillId: PR_GLORIA,       Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: gloria }
      - { SkillId: PR_IMPOSITIO,    Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: impositio }
      # Offensive support on owner's current target â€” last so support
      # work clears first.
      - { SkillId: PR_LEXAETERNA,   Level: 1,  Rate: 7000,  Target: 0 }
      - { SkillId: PR_LEXDIVINA,    Level: 5,  Rate: 5000,  Target: 0 }

  # JOB_HIGH_PRIEST = 4014 â€” Phase 6 (Trans Priest).
  - JobId: 4014
    Skills:
      - { SkillId: ALL_RESURRECTION, Level: 4, Rate: 10000, Target: 4, Condition: owner_hp_below, CondValue: 1 }
      # Self-heal (HP-tier has more SP/INT so heals at 60% are fine).
      - { SkillId: AL_HEAL,         Level: 10, Rate: 10000, Target: 1, Condition: hp_below,        CondValue: 60 }
      # Owner emergency.
      - { SkillId: AL_HEAL,         Level: 10, Rate: 10000, Target: 4, Condition: owner_hp_below,  CondValue: 80 }
      # Status cleanse.
      - { SkillId: AL_CURE,         Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: silence }
      - { SkillId: AL_CURE,         Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: blind }
      # Assumptio + Kyrie shields, both for self and for owner.
      - { SkillId: HP_ASSUMPTIO,    Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: assumptio }
      - { SkillId: HP_ASSUMPTIO,    Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: assumptio }
      - { SkillId: PR_KYRIE,        Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: kyrie }
      - { SkillId: PR_KYRIE,        Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: kyrie }
      # Self buffs.
      - { SkillId: PR_MAGNIFICAT,   Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: magnificat }
      - { SkillId: AL_ANGELUS,      Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: angelus }
      - { SkillId: PR_GLORIA,       Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: gloria }
      - { SkillId: AL_BLESSING,     Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: blessing }
      - { SkillId: AL_INCAGI,       Level: 10, Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: increase_agi }
      # Owner buffs.
      - { SkillId: AL_BLESSING,     Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: blessing }
      - { SkillId: AL_INCAGI,       Level: 10, Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: increase_agi }
      - { SkillId: PR_GLORIA,       Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: gloria }
      - { SkillId: PR_IMPOSITIO,    Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: impositio }
      # Offensive support â€” late so support clears first.
      - { SkillId: PR_LEXAETERNA,   Level: 1,  Rate: 8000,  Target: 0 }
      - { SkillId: PR_LEXDIVINA,    Level: 5,  Rate: 6000,  Target: 0 }

  # JOB_ARCH_BISHOP = 4063 â€” Phase 6 (3rd class).
  # AB priorities, in order:
  #   1. Stay alive (self-heal).
  #   2. Owner emergency heal (Highness/Coluceo/Heal).
  #   3. Status cleanse.
  #   4. Shields (Assumptio, Kyrie via Praefatio for the whole party).
  #   5. Self-only buffs (Offertorium, Magnificat, Angelus, Renovatio).
  #   6. Party-wide AoE buffs cast on self â€” Clementia, Canto, Sacrament
  #      hit every party member in range (owner + merc + anyone else).
  #      A single cast replaces 2-3 single-target casts â†’ faster setup.
  #   7. Single-target buffs that have no AoE version (Gloria, Impositio).
  #   8. Offensive support (Lex Aeterna).
  - JobId: 4063
    Skills:
      - { SkillId: ALL_RESURRECTION, Level: 4,  Rate: 10000, Target: 4, Condition: owner_hp_below, CondValue: 1 }
      # 1. Self-heal so the AB stays alive.
      - { SkillId: AL_HEAL,          Level: 10, Rate: 10000, Target: 1, Condition: hp_below,        CondValue: 65 }
      # 2. Owner emergency. Coluceo Heal (AB_CHEAL) is party-AoE â€” cast on
      #    self heals everyone in range, including merc; saves a tick.
      - { SkillId: AB_CHEAL,         Level: 3,  Rate: 10000, Target: 1, Condition: owner_hp_below,  CondValue: 60 }
      - { SkillId: AB_HIGHNESSHEAL,  Level: 5,  Rate: 10000, Target: 4, Condition: owner_hp_below,  CondValue: 75 }
      - { SkillId: AL_HEAL,          Level: 10, Rate: 10000, Target: 4, Condition: owner_hp_below,  CondValue: 85 }
      # Renovatio HoT â€” keeps the bar topped while not in danger.
      - { SkillId: AB_RENOVATIO,     Level: 1,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: renovatio }
      # 3. Cleanse.
      - { SkillId: AB_CLEARANCE,     Level: 5,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: silence }
      - { SkillId: AL_CURE,          Level: 1,  Rate: 10000, Target: 4, Condition: owner_status,    CondValue: blind }
      # 4. Shields. Praefatio is the party version of Kyrie (cast on self).
      - { SkillId: AB_PRAEFATIO,     Level: 10, Rate: 10000, Target: 1, Condition: not_owner_status, CondValue: kyrie }
      - { SkillId: HP_ASSUMPTIO,     Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: assumptio }
      - { SkillId: HP_ASSUMPTIO,     Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: assumptio }
      # 5. Self-only buffs the AB always wants up.
      - { SkillId: PR_MAGNIFICAT,    Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: magnificat }
      - { SkillId: AL_ANGELUS,       Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: angelus }
      # 6. Party-wide AoE buffs (cast on self â†’ AoE ally).
      - { SkillId: AB_CLEMENTIA,     Level: 3,  Rate: 10000, Target: 1, Condition: not_owner_status, CondValue: blessing }
      - { SkillId: AB_CANTO,         Level: 3,  Rate: 10000, Target: 1, Condition: not_owner_status, CondValue: increase_agi }
      # AB_SECRAMENT and AB_EXPIATIO are single-target Support skills (not
      # party AoE) â€” cast directly on the owner so the SC lands on them.
      # Long Cooldowns guard against the SC bit sometimes not round-tripping
      # via REPORT (causing infinite re-casts otherwise).
      - { SkillId: AB_SECRAMENT,     Level: 5,  Rate: 10000, Target: 3, Condition: not_owner_status, CondValue: secrament,   Cooldown: 240000 }
      - { SkillId: AB_EXPIATIO,      Level: 5,  Rate: 10000, Target: 3, Condition: not_owner_status, CondValue: expiatio,    Cooldown: 240000 }
      # Offertorium is a self-buff that boosts the AB's heal output (90s).
      - { SkillId: AB_OFFERTORIUM,   Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: offertorium, Cooldown: 90000 }
      # 7. Single-target buffs without AoE version.
      - { SkillId: PR_GLORIA,        Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status,  CondValue: gloria }
      - { SkillId: PR_GLORIA,        Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: gloria }
      - { SkillId: PR_IMPOSITIO,     Level: 5,  Rate: 10000, Target: 4, Condition: not_owner_status, CondValue: impositio }
      # 8. Offensive support.
      - { SkillId: PR_LEXAETERNA,    Level: 1,  Rate: 9000,  Target: 0 }

  # JOB_WIZARD = 9
  - JobId: 9
    Skills:
      # -- passive --
      - { SkillId: MG_SRECOVERY,    Level: 10, Rate: 10000 }
      # -- offense (elemental combo: freeze â†’ Jupitel) --
      - { SkillId: WZ_JUPITEL,      Level: 10, Rate: 10000, Condition: enemy_status, CondValue: SC_FREEZE }
      - { SkillId: WZ_STORMGUST,    Level: 10, Rate: 8000, Condition: enemy_count_nearby, CondValue: 2 }
      - { SkillId: WZ_VERMILION,    Level: 10, Rate: 7000  }
      - { SkillId: WZ_METEOR,       Level: 10, Rate: 7000, Condition: enemy_count_nearby, CondValue: 3 }
      - { SkillId: WZ_EARTHSPIKE,   Level: 5,  Rate: 6000  }
      - { SkillId: WZ_FROSTNOVA,    Level: 10, Rate: 6000, Condition: melee_attacked }
      - { SkillId: WZ_FIREPILLAR,   Level: 10, Rate: 5000  }
      - { SkillId: WZ_QUAGMIRE,     Level: 5,  Rate: 5000, Condition: melee_attacked }
      # -- defense --
      - { SkillId: MG_SAFETYWALL,   Level: 10, Target: 1, Condition: melee_attacked }
      - { SkillId: WZ_SIGHTBLASTER, Level: 1,  Rate: 5000, Target: 1, Condition: melee_attacked }
      # -- self-buff --
      - { SkillId: MG_ENERGYCOAT,   Level: 1,  Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_ENERGYCOAT }
      # -- detection --
      - { SkillId: MG_SIGHT,        Level: 1,  Rate: 10000, Target: 1, Condition: enemy_hidden }

  # JOB_BLACKSMITH = 10
  - JobId: 10
    Skills:
      # -- passive --
      - { SkillId: BS_HILTBINDING,    Level: 1,  Rate: 10000 }
      - { SkillId: BS_FINDINGORE,     Level: 1,  Rate: 10000 }
      - { SkillId: BS_WEAPONRESEARCH, Level: 10, Rate: 10000 }
      - { SkillId: BS_SKINTEMPER,     Level: 5,  Rate: 10000 }
      - { SkillId: BS_UNFAIRLYTRICK,  Level: 1,  Rate: 10000 }
      # -- offense --
      - { SkillId: BS_HAMMERFALL,    Level: 5,  Rate: 10000, Condition: enemy_count_nearby, CondValue: 2 }
      - { SkillId: MC_MAMMONITE,     Level: 10, Rate: 8000  }
      - { SkillId: MC_CARTREVOLUTION, Level: 1, Rate: 7000, Condition: enemy_count_nearby, CondValue: 3 }
      # -- self-buffs --
      - { SkillId: BS_ADRENALINE,    Level: 5,  Rate: 10000, Target: 1, Condition: not_self_status, CondValue: SC_ADRENALINE }
