# DimensionsRO ia-server - Phase 4 per-job, per-tier shell profiles.
#
# Tiers:
#   T0 = town (base 30, soft gear)
#   T1 = field (base 60, mid gear)
#   T2 = dungeon (base 90, end gear)
#
# Stats: BaseLevel + JobLevel + Str/Agi/Vit/Int/Dex/Luk + Speed.
# Equipment: Weapon/HandR, Shield/HandL, HeadTop/Mid/Low, Armor, Garment,
# Shoes, AccR, AccL - by item nameid.
#
# Map-server feeds these into status_calc_pc - same path real players use
# after pc_authok. Final HP/SP/Atk/Hit/Flee/Def/MAtk/MDef are derived from
# class formulas + equipped items, NOT hardcoded here.
#
# Phase 5 — Equipment slots accept EITHER a single nameid (current
# behavior) or a YAML sequence (gear pool, random pick per spawn):
#   Weapon: 1158
#   Weapon: [1158, 1162, 1170]
# Use 0 in a sequence to mean "no item in that slot" — useful for slots
# that should be empty for some shells (e.g. shield: [1102, 0]).
#
# Equipment IDs mirror what the Mega Booster Support NPC
# (npc/custom/dro_starter_kit.txt) hands to real players, so a shell is
# stat-equivalent to a player who just collected the kit.

Header:
  Type: AI_PROFILE_DB
  Version: 2

Defaults:
