###########################################################################
# Player Group Database
###########################################################################
#
# Player Group Settings
#
###########################################################################
# - Id                    Group ID.
#   Name                  Group name.
#   Level                 GM Level used for ranking groups. (Default: 0)
#   LogCommands           Whether atcommands should be logged or not. (Default: false)
#   Commands:             List of atcommands that can be used by this group. (Default: none)
#     <atcommand name>    Whether the specified atcommand can be used by this group or not.
#   CharCommands:         List of charcommands that can be used by this group. (Default: none)
#     <charcommand name>  Whether the specified charcommand can be used by this group or not.
#   Permissions:          List of permissions the group has. (Default: none)
#     <permission name>   Whether the group has this permission or not.
#   Inherit:              List of groups that will be inherited. (Default: none)
#     <group name>        Whether this group will be inherited or not.
###########################################################################

Header:
  Type: PLAYER_GROUP_DB
  Version: 1

Body:
  # Extend Admin with dev-useful #charcommands. Stock conf/groups.yml only
  # gives Admin the tiny CharCommands list it inherits from Support
  # (item/zeny/disguise/undisguise/size). all_commands covers @-prefix only;
  # there's no equivalent all_charcommands flag.
  #
  # parseCommands rejects the entire block if any name doesn't match a real
  # atcommand — every entry below was verified against doc/atcommands.txt.
  - Id: 99
    CharCommands:
      blvl: true
      jlvl: true
      stpoint: true
      skpoint: true
      jobchange: true
      allskill: true
      heal: true
      warp: true
      go: true
      stats: true
      option: true
      effect: true
      kill: true
      killable: true
      mute: true
      jail: true
      unjail: true
      mount: true
      reset: true
      resetstat: true
      resetskill: true
      changesex: true
      changecharsex: true
      petrename: true
      recall: true
      recallall: true
      save: true
      disguise: true
      kami: true
      kamib: true
      kamic: true
