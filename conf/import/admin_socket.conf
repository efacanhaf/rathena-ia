// DimensionsRO — admin command bridge config.
//
// Loaded by src/map/admin_socket.cpp at map-server boot. If the file is
// absent or `token` is empty/CHANGE_ME, the bridge stays disabled.
//
// Format: key: value (one per line). Comments start with // or #.

// Shared secret — Discord bot must send this in the AUTH line.
// Generate something like: openssl rand -hex 32
token: CHANGE_ME

// Listening port.
port: 7000

// Bind address. Keep on 127.0.0.1 — exposure is gated through an SSH tunnel
// from the Kaori host. Never bind to 0.0.0.0.
bind_ip: 127.0.0.1

// Comma-separated list of atcommand names the bridge will accept.
// Anything outside this list is rejected with `ERR not_whitelisted`.
// When omitted (or commented out), the binary's hardcoded default list is used
// (see DEFAULT_ADMIN_WHITELIST in src/map/admin_socket.cpp).
//
// allowed_commands: reloadbattleconf,reloaditemdb,reloadmobdb,reloadskilldb,reloadscript,reloadatcommand,reloadstatusdb,loadnpc,reloadbarterdb,reloadquestdb,reloadmsgconf,reloadnpc,reloadachievementdb,reloadinstancedb,event
