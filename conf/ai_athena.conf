// ai-server configuration
// Optional cluster peer that runs on its own machine and drives a population
// of "shells" (fake players) over the existing rAthena map-server.
// See ia-server-plan.md for full architecture.

// IP/port the ai-server itself binds to (currently reserved; ai-server
// connects out to char-server, doesn't accept inbound clients).
ai_ip: 127.0.0.1
ai_port: 7280

// char-server we connect to as a peer.
// Must match the IP/port the char-server listens on for map peers.
char_server_ip: 127.0.0.1
char_server_port: 7270

// Credentials presented to char-server during handshake.
// Distinct from map-server credentials. Char-server validates against
// ai_userid / ai_passwd in inter_athena.conf (additive keys).
ai_userid: s1
ai_passwd: p1

// Phase 5 — death/respawn.
// On AI_EVT_DIED the shell schedules a respawn at its home location after
// this many ms. The despawn+spawn pair is sent over chrif; the same
// shell_id/name/gear come back. 0 disables (shells stay dead).
respawn_delay_ms: 30000

// Phase 5 — verbosity gate for AI_LOG(level, ...). 0 = silent.
// 1 = state changes (spawn ack, respawn fired, drift warp).
// 2 = combat decisions (target acquired, skill chosen).
// 3 = tick details. 4 = packet level. 5 = trace.
debug_level: 0

import: conf/import/ai_conf.txt
